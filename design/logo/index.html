<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deckle · logo options</title>
    <link rel="stylesheet" href="../../packages/tokens/dist/tokens.css" />
    <link rel="stylesheet" href="../art-direction/assets/fonts/fonts.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px;
        background: #e8e6e2;
        color: #181614;
        font:
          400 15px/1.5 'Host Grotesk',
          sans-serif;
      }

      h1 {
        margin: 0 0 28px;
        font-size: 22px;
        font-weight: 600;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(5, 320px);
        gap: 24px;
      }

      .option {
        display: grid;
        gap: 12px;
        align-content: start;
      }

      .option h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }

      .option p {
        margin: 0;
        min-height: 66px;
        color: #4a453f;
        font-size: 13.5px;
      }

      .pane {
        display: grid;
        place-items: center;
        min-height: 84px;
        padding: 20px;
        border-radius: 12px;
        background: var(--surface-page);
        color: var(--text-primary);
      }

      .pane.big {
        min-height: 220px;
      }

      .pane.dark {
        color-scheme: dark;
      }

      .pane.deep {
        background: var(--surface-deep);
        color: var(--text-on-deep);
      }

      .pane.deep .mark {
        color: currentColor;
      }

      .big .mark {
        inline-size: 150px;
        block-size: 150px;
      }

      /* A lockup as the header draws it: mark, then the name. */
      .lockup {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: inherit;
        text-decoration: none;
      }

      .lockup .mark {
        inline-size: 30px;
        block-size: 30px;
      }

      .mark {
        flex: none;
        color: var(--icon-accent);
        --plate: var(--accent-default);
        --ink: var(--text-primary);
      }

      .deep .mark {
        --ink: var(--text-on-deep);
      }

      .word-grotesk {
        font-family: 'Host Grotesk', sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .word-imprint {
        font-family: 'Host Grotesk', sans-serif;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.22em;
        line-height: 1;
        text-transform: uppercase;
      }

      .word-ibarra {
        font-family: 'Ibarra Real Nova', serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.005em;
        line-height: 1;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 22px;
        inline-size: 100%;
      }

      .header nav {
        display: flex;
        gap: 14px;
        color: var(--text-secondary);
        font-size: 13px;
      }

      /* A browser tab, where the mark is sixteen pixels. */
      .tabs {
        display: flex;
        align-items: end;
        gap: 18px;
        inline-size: 100%;
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 12px;
        border-radius: 8px 8px 0 0;
        background: var(--surface-band);
        font-size: 12px;
      }

      .tab .mark {
        inline-size: 16px;
        block-size: 16px;
      }

      .sizes {
        display: flex;
        align-items: end;
        gap: 12px;
      }

      .sizes .mark:nth-child(1) {
        inline-size: 32px;
        block-size: 32px;
      }

      .sizes .mark:nth-child(2) {
        inline-size: 48px;
        block-size: 48px;
      }

      .label {
        justify-self: start;
        color: #6d665e;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">

        <symbol id="today" viewBox="0 0 24 24">

          />
        </symbol>

        <!-- A · The D is a sheet: the stem is the cut edge, the bowl the deckle, the
             feathered edge a paper mould leaves on handmade paper. -->

          <path

        <!-- B · The D engraved with a burin: each cut swells where the tool goes deep

        <symbol id="burin" viewBox="0 0 48 48">

          />

        <!-- C · A studio's seal, carved: the D left in the paper, the rest inked. -->
        <symbol id="seal" viewBox="0 0 48 48">
          <path
            fill="currentColor"
            fill-rule="evenodd"
            d="M5.9 5.9C6.75 5.01 8.77 5.18 10.43 5.11C12.09 5.03 14.05 5.48 15.86 5.44C17.67 5.41 19.48 4.95 21.29 4.89C23.1 4.84 24.9 5.13 26.71 5.11C28.52 5.1 30.33 4.75 32.14 4.78C33.95 4.82 35.91 5.14 37.57 5.33C39.23 5.52 41.15 5.05 42.1 5.9C43.05 6.75 43.06 8.77 43.28 10.43C43.5 12.09 43.42 14.05 43.42 15.86C43.42 17.67 43.37 19.48 43.27 21.29C43.18 23.1 42.95 24.9 42.84 26.71C42.74 28.52 42.59 30.33 42.65 32.14C42.71 33.95 43.3 35.91 43.21 37.57C43.12 39.23 43.04 41.18 42.1 42.1C41.16 43.02 39.23 42.97 37.57 43.06C35.91 43.15 33.95 42.62 32.14 42.64C30.33 42.66 28.52 43.09 26.71 43.17C24.9 43.25 23.1 43.15 21.29 43.12C19.48 43.09 17.67 43.06 15.86 43C14.05 42.94 12.09 42.89 10.43 42.74C8.77 42.59 6.79 42.96 5.9 42.1C5.01 41.24 5.28 39.23 5.08 37.57C4.89 35.91 4.84 33.95 4.75 32.14C4.66 30.33 4.51 28.52 4.56 26.71C4.6 24.9 4.98 23.1 5 21.29C5.02 19.48 4.63 17.67 4.69 15.86C4.74 14.05 5.12 12.09 5.32 10.43C5.52 8.77 5.05 6.79 5.9 5.9ZM14.8 12.7L25.3 12.4C32.4 12.6 36.2 17.4 36.1 24.2C36 30.6 32.3 35.6 25.6 35.4L14.6 35.7ZM20.6 18.3L24.8 18.6C28.5 18.4 30.2 21 30.1 24.1C30 27.4 28.2 29.6 24.9 29.4L20.4 29.7ZM8.8 38.4a0.75 0.75 0 1 0 1.5 0a0.75 0.75 0 1 0 -1.5 0ZM38.1 9.6a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0ZM39.4 31.2a0.45 0.45 0 1 0 0.9 0a0.45 0.45 0 1 0 -0.9 0Z"
          />
        </symbol>
      </defs>
    </svg>

    <h1>Deckle · logo options</h1>

    <div class="grid" id="grid"></div>

    <script type="module">
      // Each option is drawn in the same places: large, in the header in both
      // themes, in the footer, and as a favicon in a browser tab.
      const options = [
        {
          id: 'today',
          name: 'Today',
          about: 'A sheet with a sawtooth edge, and the name in Host Grotesk.',
          word: 'word-grotesk',
          text: 'Deckle',
        },
        {
          id: 'deckle',
          name: 'A · The deckle',
          about:
            'The D is a sheet of handmade paper: a straight cut edge, and the soft, uneven deckle the mould leaves, which gives the shop its name.',
          word: 'word-grotesk',
          text: 'Deckle',
        },
        {
          id: 'burin',
          name: 'B · The burin',
          about:
            'The D engraved line by line, as Dürer cut copper: each cut swells where the burin goes deep and tapers where it lifts. The name set like an imprint.',
          word: 'word-imprint',
          text: 'Deckle',
        },
        {
          id: 'seal',
          name: 'C · The studio seal',
          about:
            'The chop a print studio stamps on every sheet, carved, with the name set in Ibarra Real Nova, a type cut for an eighteenth-century printer.',
          word: 'word-ibarra',
          text: 'Deckle',
        },
        {
          id: 'seal',
          name: 'Chosen · C’s seal, B’s name',
          about:
            'The studio seal as the mark, and the name set as an imprint: capitals in Host Grotesk, spaced wide. Chosen by the owner on 6 October 2026.',
          word: 'word-imprint',
          text: 'Deckle',
        },
      ];

      const mark = (id) => `<svg class="mark" aria-hidden="true"><use href="#${id}"/></svg>`;
      const lockup = (o) =>
        `<span class="lockup">${mark(o.id)}<span class="${o.word}">${o.text}</span></span>`;

      document.getElementById('grid').innerHTML = options
        .map(
          (o) => `
          <section class="option">
            <h2>${o.name}</h2>
            <p>${o.about}</p>
            <div class="pane big">${mark(o.id)}</div>
            <div class="pane"><div class="header">${lockup(o)}<nav><span>Prints</span><span>Drops</span><span>Journal</span></nav></div></div>
            <div class="pane dark"><div class="header">${lockup(o)}<nav><span>Prints</span><span>Drops</span><span>Journal</span></nav></div></div>
            <div class="pane deep">${lockup(o)}</div>
            <div class="pane"><div class="tabs"><span class="tab">${mark(o.id)}Deckle · Melencolia I</span><span class="sizes">${mark(o.id)}${mark(o.id)}</span></div></div>
            <div class="pane dark"><div class="tabs"><span class="tab">${mark(o.id)}Deckle · Melencolia I</span><span class="sizes">${mark(o.id)}${mark(o.id)}</span></div></div>
          </section>`,
        )
        .join('');
    </script>
  </body>
</html>
