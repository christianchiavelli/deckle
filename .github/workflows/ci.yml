name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the run in flight irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Reading the code is all most jobs do; the one that publishes images widens this for itself.
# No checkout keeps the token in .git, where a later step or an artifact could pick it up.
permissions:
  contents: read

jobs:
  workflows:
    name: Workflow audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Expressions, job graphs and every run script, through the image's shellcheck.
      - name: Lint workflows
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      # Injection, excessive permissions, persisted credentials, and actions
      # pinned to a commit their repository does not have, which takes the token.
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --format github .github/workflows

  verify:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Only to start pnpm: the runtime the scripts use is pinned by `devEngines`
      # and downloaded by the install, as on a laptop.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and test
        run: pnpm run ci

      # Last, because it is the slowest and a failure above already says more.
      - name: Build
        run: pnpm run build

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: '**/coverage/'
          retention-days: 7

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Testcontainers starts a real Postgres 18 on the runner's Docker for each suite.
      # Every package runs to the end, so one failure does not stop the others mid-test.
      - name: Test
        run: pnpm -r --if-present --no-bail run test:integration

  contract:
    name: Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The whole history, to read the schema as it was before this push or pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each committed schema, the gateway's and the Shop API it reads, is what the
      # code generates, not a hand-edited copy.
      - name: Check schemas
        run: pnpm -r --if-present run schema:check

      # Changes go straight to main, so a push is compared with the commit before
      # it, and a pull request with its base. A first push has nothing to compare.
      - name: Check for breaking changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE:services/gateway/schema.gql" 2>/dev/null; then
            pnpm --filter @deckle/gateway schema:diff "$BASE"
          else
            echo "No schema at the base commit: nothing to compare."
          fi

  stories:
    name: Storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm --filter @deckle/ui exec playwright install --with-deps chromium

      # Each story renders, plays its interactions and passes axe, light and dark side by side.
      - name: Test stories
        run: pnpm --filter @deckle/ui test:stories

  images:
    name: Publish ${{ matrix.service }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, integration, contract, stories]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # To sign the build provenance with the workflow's identity.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: commerce
            dockerfile: services/commerce/Dockerfile
          - service: cms
            dockerfile: apps/cms/Dockerfile
          - service: gateway
            dockerfile: services/gateway/Dockerfile
          - service: store
            dockerfile: apps/store/Dockerfile
          - service: storybook
            dockerfile: packages/ui/Dockerfile
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/deckle-${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  stack:
    name: E2E and load
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The images this run published, by the tag metadata-action gave them, with
      # two gateways: the browser checks run across both, and so does the load.
      - name: Start stack
        run: |
          echo "DECKLE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          DECKLE_TAG="sha-${GITHUB_SHA::7}" docker compose up --wait --wait-timeout 300 --no-build \
            --scale gateway=2

      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://localhost:8080/healthz
          curl --fail --silent --show-error http://localhost:8082/health
          curl --fail --silent --show-error http://localhost:8081/api/health
          curl --fail --silent --show-error http://localhost:8080/graphql \
            --header 'content-type: application/json' \
            --data '{"query":"{ artworks(first: 1) { totalCount } }"}' \
            | jq --exit-status '.data.artworks.totalCount > 0'
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/
          curl --fail --silent --show-error http://localhost:8083/index.json \
            | jq --exit-status '.entries["screens-work-page--desktop"].type == "story"'
          # Only the gateway, from inside Docker's network, may drop the store's cache.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://localhost:8080/api/revalidate)" = 404

      # Node and pnpm only to drive a browser: the stack itself is the published images.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Playwright
        run: |
          pnpm install --frozen-lockfile --filter @deckle/e2e
          pnpm --filter @deckle/e2e exec playwright install --with-deps chromium

      - name: Test
        run: pnpm --filter @deckle/e2e test:e2e

      # A thousand people claim the drop's copies in the same second, through both
      # gateways. Each gateway must have answered its share, or two proved nothing.
      - name: Load test
        run: |
          since="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          docker compose run --rm --no-deps load
          docker compose logs gateway --since "$since" --no-color \
            | grep '"method":"POST","path":"/graphql"' \
            | cut --delimiter '|' --fields 1 | sort | uniq --count | tee answered
          test "$(wc --lines < answered)" -eq 2

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Save stack logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --timestamps > compose.log

      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-log
          path: compose.log
          retention-days: 7

      - name: Stop stack
        if: ${{ always() }}
        run: docker compose down --volumes
