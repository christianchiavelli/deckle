"""Who made the work, as The Met records it."""
type Artist {
  beginYear: Int

  """As The Met words it, e.g. "German, Nuremberg 1471–1528 Nuremberg"."""
  bio: String
  endYear: Int
  name: String!
  nationality: String
}

"""A work from The Met, sold as open-edition prints."""
type Artwork {
  accessionNumber: String

  """Null when the maker is unknown."""
  artist: Artist
  classification: String
  creditLine: String
  culture: String

  """As The Met dates it, e.g. "ca. 1830–32"."""
  date: String
  department: String

  """One line per measurement: plate, sheet and so on."""
  dimensions: [String!]!

  """The Met's title, verbatim."""
  fullTitle: String!
  id: ID!
  image: ArtworkImage
  medium: String

  """The work's page on metmuseum.org."""
  museumUrl: String!
  period: String

  """The cheapest size for sale; null when none is."""
  priceFrom: Money
  sizes: [PrintSize!]!
  slug: String!

  """Null when the CMS has no story for this work."""
  story: Story

  """
  The family of process commerce files the work under, e.g. "Etchings"; null when none.
  """
  technique: String

  """The title as the shop shows it."""
  title: String!

  """
  The year the work was begun, to order and group by; null when The Met gives none.
  """
  year: Int
}

"""
Commerce changed something about an artwork; read it again to see what.
"""
type ArtworkChange {
  action: ChangeAction!

  """The artwork as it is now; null once it is deleted."""
  artwork: Artwork
  kind: ArtworkChangeKind!

  """When commerce made the change."""
  occurredAt: DateTime!
  slug: String!
}

"""
What changed in commerce: the work, one of its sizes, a price, or stock.
"""
enum ArtworkChangeKind {
  PRICE
  PRODUCT
  STOCK
  VARIANT
}

"""A page of artworks."""
type ArtworkConnection {
  edges: [ArtworkEdge!]!
  pageInfo: PageInfo!

  """Artworks in the whole list, not just this page."""
  totalCount: Int!
}

type ArtworkEdge {
  """Opaque; pass it as `after` to read on from here."""
  cursor: String!
  node: Artwork!
}

"""Narrows the artworks listed."""
input ArtworkFilter {
  """A collection slug."""
  collection: String
}

"""The picture the shop shows, and the size of the scan it prints from."""
type ArtworkImage {
  height: Int!

  """The original scan's height in pixels."""
  scanHeight: Int!

  """The original scan's width in pixels."""
  scanWidth: Int!

  """The full-size master, served through /assets."""
  url: String!
  width: Int!
}

"""
This browser's cart: open-edition prints, with the flat rate for shipping once there is something to ship.
"""
type Cart {
  lines: [OrderLine!]!

  """How many prints, every copy counted."""
  quantity: Int!

  """Null while the cart is empty."""
  shipping: Money

  """Null while the cart is empty."""
  subtotal: Money

  """Null while the cart is empty."""
  total: Money
}

"""A width and a height, in centimetres."""
type Centimetres {
  height: Float!
  width: Float!
}

enum ChangeAction {
  CREATED
  DELETED
  UPDATED
}

"""Who an order is for and where it goes: the checkout form, as typed."""
input CheckoutInput {
  city: String!

  """ISO 3166-1 alpha-2, one of `countries`."""
  countryCode: String!

  """Where the receipt goes, and nothing else."""
  email: String!
  fullName: String!
  postalCode: String!
  streetLine1: String!
  streetLine2: String
}

"""
A group of works in the commerce catalogue, such as a department or a theme.
"""
type Collection {
  """The works in this collection, ordered by title."""
  artworks(
    """Read on after this cursor."""
    after: String

    """How many to return, from 1 to 48."""
    first: Int = 24
  ): ArtworkConnection!
  id: ID!
  name: String!
  slug: String!
}

"""Where one numbered copy stands."""
enum CopyState {
  """Held for someone for ten minutes while they pay."""
  HELD

  """The next claim may take it."""
  OPEN

  """Paid for: it is printed, numbered and posted."""
  SOLD
}

"""A country the shop ships to."""
type Country {
  """ISO 3166-1 alpha-2."""
  code: String!
  name: String!
}

"""Works an editor grouped in the CMS, in the order they chose."""
type Curation {
  """
  The works in the order the editor set. A work commerce no longer sells is left out.
  """
  artworks: [Artwork!]!

  """A few plain sentences that open the curation."""
  intro: String
  slug: String!
  title: String!
  updatedAt: DateTime!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

"""
Fifty numbered copies of one print, released at a set hour: first come, first served, one per person.
"""
type Drop {
  """The work the drop prints."""
  artwork: Artwork

  """The work's slug; its `artwork` is resolved from it."""
  artworkSlug: String!

  """How many numbered copies there are."""
  editionSize: Int!

  """When the first claim may be made."""
  opensAt: DateTime!

  """The words on the drop's page; null until an editor publishes them."""
  page: DropPage

  """
  The paper every copy is printed on, from the edition commerce sells; null when it sells none.
  """
  paperSize: PaperSize

  """
  A copy's price, shipping included; null when commerce sells no edition of it.
  """
  price: Money
  slug: String!

  """
  Where its copies stand now. Never cached: read it fresh, then follow `dropStockChanged`.
  """
  stock: DropStock!

  """
  The signed-in account's copy of this drop, held or bought; null for a guest or none.
  """
  viewerCopy: DropCopy
}

"""A numbered copy that belongs to the signed-in account."""
type DropCopy {
  """The drop's slug."""
  drop: String!

  """When a hold runs out."""
  heldUntil: DateTime

  """The number pencilled on it, out of the edition."""
  number: Int!

  """Commerce's order, once paid."""
  orderCode: String

  """
  Whole seconds left on a hold, by the database's clock: count down from this, not from the browser's clock.
  """
  secondsLeft: Int

  """HELD while it waits for payment, SOLD once paid."""
  state: CopyState!
}

"""The words on a drop's page, from the CMS."""
type DropPage {
  blocks: [StoryBlock!]!
  headline: String!
}

"""Where a drop's copies stand, by the database's clock."""
type DropStock {
  """Each copy, copy 1 first."""
  copies: [CopyState!]!
  held: Int!
  open: Int!
  sold: Int!
}

type HeadingBlock {
  """2 or 3: the levels under the story title."""
  level: Int!
  text: [TextRun!]!
}

"""An amount in the currency's minor unit: 5500 USD is $55.00."""
type Money {
  """Minor units, e.g. cents."""
  amount: Int!

  """ISO 4217 code, e.g. USD."""
  currencyCode: String!
}

type Mutation {
  """Adds a print to the cart, starting the cart if there was none."""
  addToCart(
    """The work's slug."""
    artwork: String!

    """From 1 to 10."""
    quantity: Int! = 1
    size: PaperSize!
  ): Cart!

  """
  Claims the lowest open copy, held for this account for ten minutes. One per person; a signed-in account only.
  """
  claimCopy(drop: String!): DropCopy!

  """
  Finishes making a passkey with the JSON the device answered: the account is made and signed in.
  """
  finishPasskeyRegistration(response: String!): Viewer!

  """
  Finishes signing in with the JSON the device answered; the cart stays as it was.
  """
  finishPasskeySignIn(response: String!): Viewer!

  """
  Pays for the copy this account holds: its shipping is included, and the test payment settles at once.
  """
  payForCopy(drop: String!, input: CheckoutInput!): PlacedOrder!

  """
  Places the cart as a guest order: contact, address, the flat rate, and the test payment, which settles at once.
  """
  placeOrder(input: CheckoutInput!): PlacedOrder!

  """
  Gives back the copy this account holds, for the next person. False when it held none.
  """
  releaseCopy(drop: String!): Boolean!

  """Changes how many of a line the cart holds; 0 removes it."""
  setCartLineQuantity(
    line: ID!

    """From 0, which removes the line, to 10."""
    quantity: Int!
  ): Cart!

  """
  Signs this browser out. The cart stays: it was the browser’s, not the account’s.
  """
  signOut: Boolean!

  """
  Starts making a passkey, which makes an account: the options for `navigator.credentials.create()`, as JSON.
  """
  startPasskeyRegistration: String!

  """
  Starts signing in with a passkey: the options for `navigator.credentials.get()`, as JSON.
  """
  startPasskeySignIn: String!
}

"""One line of a cart or an order: a work at one size, so many times."""
