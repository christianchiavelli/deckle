  """The number pencilled on a numbered copy; null for an open edition."""
  copyNumber: Int

  """
  The drop's slug when the line is a numbered copy; null for an open edition.
  """
  drop: String

  """How many copies the line's edition has; null for an open edition."""
  editionSize: Int
  id: ID!

  """The line, taxes included."""
  price: Money!
  quantity: Int!
  size: PaperSize

  """One print, taxes included."""
  unitPrice: Money!
}

