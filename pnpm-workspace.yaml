packages:
  - apps/*
  - services/*
  - packages/*
  - design/*
  - e2e

# One version of each dependency for the whole repository, checked at the
# source on 5 October 2026. A package names `catalog:` instead of a range, so
# an upgrade is one line here, reviewed once.
#
# Some versions are held back on purpose, each with its reason in docs/adr:
# TypeScript 6.0 (the Nest CLI and typescript-eslint refuse 7.0), graphql 16
# (Apollo Server 5 accepts nothing newer), Vendure 3.7.4 exactly, Drizzle
# before 1.0 and a styled-components prerelease.
catalog:
  # Language and tooling
  typescript: 6.0.3
  '@types/node': 24.19.1
  prettier: 3.9.9
  eslint: 10.12.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.71.0
  globals: 17.13.0
  vitest: 5.0.3
  # Design system
  style-dictionary: 5.6.0
  # A prerelease on purpose: 6.5.3 drops the CSS of a component that renders in a
  # Suspense fallback and then in the content (#5808, fixed by #5815). See docs/adr.
  styled-components: 6.6.0-prerelease-20260925231434
  storybook: 10.6.1
  '@storybook/nextjs-vite': 10.6.1
  '@storybook/addon-a11y': 10.6.1
  '@storybook/addon-docs': 10.6.1
  '@storybook/addon-vitest': 10.6.1
  eslint-plugin-storybook: 10.6.1
  eslint-plugin-react-hooks: 7.1.1
  '@vitest/browser-playwright': 5.0.3
  '@capsizecss/core': 4.1.3
  '@capsizecss/metrics': 4.3.0
  '@capsizecss/unpack': 4.0.1
  '@vitest/coverage-v8': 5.0.3
  vite: 8.3.2
  tsx: 4.23.15
  testcontainers: 12.2.0
  '@testcontainers/postgresql': 12.2.0
  playwright: 1.63.0
  '@playwright/test': 1.63.0

  # Contracts and data
  zod: 4.6.5
  graphql: 16.14.2
  pg: 8.23.1
  '@types/pg': 8.23.1
  drizzle-orm: 0.45.3
  drizzle-kit: 0.31.11
  sharp: 0.35.5
  jose: 6.2.12

  # Commerce
  '@vendure/core': 3.7.4
  '@vendure/common': 3.7.4
  '@vendure/asset-server-plugin': 3.7.4
  '@vendure/email-plugin': 3.7.4
  '@vendure/dashboard': 3.7.4
  '@vendure/testing': 3.7.4
  # The migrations import TypeORM's types. Held on the 0.3 line Vendure 3.7
  # depends on (^0.3.21), at the version it resolves, so there is one copy.
  typeorm: 0.3.31

  # CMS
  payload: 3.90.2
  '@payloadcms/next': 3.90.2
  '@payloadcms/db-postgres': 3.90.2
  '@payloadcms/richtext-lexical': 3.90.2
  '@payloadcms/ui': 3.90.2
  '@payloadcms/translations': 3.90.2
  next: 16.3.8
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # Bundles the CMS seed into one file the standalone image can run; it also
  # satisfies Vite 8's optional esbuild peer, which would otherwise resolve to
  # drizzle-kit's 0.25.
  esbuild: 0.28.2

  # Gateway
  '@nestjs/common': 12.1.2
  '@nestjs/core': 12.1.2
  '@nestjs/platform-express': 12.1.2
  '@nestjs/testing': 12.1.2
  '@nestjs/cli': 12.0.8
  '@nestjs/config': 12.0.1
  '@nestjs/terminus': 12.1.0
  '@nestjs/graphql': 14.0.3
  '@nestjs/apollo': 14.0.3
  '@apollo/server': 5.5.1
  '@as-integrations/express5': 1.1.2
  graphql-ws: 6.3.0
  ws: 8.22.0
  '@types/ws': 8.18.2
  graphql-query-complexity: 2.0.0
  '@escape.tech/graphql-armor': 3.2.0
  dataloader: 2.2.3
  '@simplewebauthn/server': 14.0.3
  rxjs: 7.8.2
  reflect-metadata: 0.2.2
  supertest: 7.3.1
  '@types/supertest': 7.2.1
  '@graphql-inspector/cli': 7.0.0
  '@graphql-codegen/cli': 7.4.4
  '@graphql-codegen/typescript': 6.1.1
  '@graphql-codegen/typescript-operations': 6.1.10
  '@graphql-codegen/typed-document-node': 7.1.1
  # Express ships no types, and the Nest Express adapter's own declarations import them.
  '@types/express': 5.0.6

# Named catalogs hold a second line of a package that one service is pinned to.
catalogs:
  # Vendure 3.7.4 runs on NestJS 11 while the gateway is on 12. A Vendure plugin's
  # decorators must come from the @nestjs/common instance Vendure itself loads, so
  # commerce names it at the exact version Vendure resolves and pnpm keeps one copy.
  vendure:
    '@nestjs/common': 11.2.7

# Vendure's plugins and test kit import NestJS and Vendure itself without
# declaring them. Left alone, pnpm hands them whatever is hoisted, which here
# mixes in the gateway's NestJS 12 and @nestjs/graphql 14: the asset server then
# fails to inject ModuleRef, because Vendure 3.7 runs on NestJS 11. Declaring
# them ties each import to the copy Vendure loads. Images are not affected, as
# they install commerce alone; every version below is the one Vendure resolves.
packageExtensions:
  '@vendure/asset-server-plugin@3.7.4':
    dependencies:
      '@nestjs/common': 11.2.7
      '@nestjs/core': 11.2.7
      '@vendure/common': 3.7.4
      '@vendure/core': 3.7.4
  '@vendure/email-plugin@3.7.4':
    dependencies:
      '@nestjs/common': 11.2.7
      '@nestjs/core': 11.2.7
      '@vendure/common': 3.7.4
      '@vendure/core': 3.7.4
  '@vendure/dashboard@3.7.4':
    dependencies:
      '@nestjs/common': 11.2.7
      '@nestjs/graphql': 13.1.0
      '@vendure/common': 3.7.4
      '@vendure/core': 3.7.4
      express: 5.2.1
      graphql-tag: 2.12.7
  '@vendure/testing@3.7.4':
    dependencies:
      '@nestjs/core': 11.2.7
      '@vendure/core': 3.7.4

# @nestjs/terminus offers health checks for many backends through optional
# peers, and pnpm links each one it finds anywhere in the workspace, so
# commerce's TypeORM and Testcontainers' gRPC would ship in the gateway's image
# unused. Its health checks need none of them.
overrides:
  '@nestjs/terminus>typeorm': '-'
  '@nestjs/terminus>@grpc/grpc-js': '-'
  '@nestjs/terminus>@grpc/proto-loader': '-'

# A version reaches this repository a day after it is published (pnpm's
# default since 11), which keeps out the releases that get pulled within hours.
# These were a day old or less when the repository started, and are pinned
# exactly in the catalog: Vendure 3.7.4 fixes overselling in concurrent
# checkouts, and the codegen packages are what the store's types are generated with.
minimumReleaseAgeExclude:
  - '@vendure/core@3.7.4'
  - '@vendure/common@3.7.4'
  - '@vendure/asset-server-plugin@3.7.4'
  - '@vendure/email-plugin@3.7.4'
  - '@vendure/dashboard@3.7.4'
  - '@vendure/testing@3.7.4'
  - '@graphql-codegen/cli@7.4.4'
  - '@graphql-codegen/typescript@6.1.1'
  - '@graphql-codegen/typescript-operations@6.1.10'

# Dependency build scripts are opt-in: a postinstall is arbitrary code run at
# install time. Each package that needs one is listed with its reason.
allowBuilds:
  # sharp downloads libvips for the platform; image resizing fails without it.
  sharp: true
  # esbuild ships its native binary through an install script.
  esbuild: true
  # Vendure hashes passwords with bcrypt, which ships prebuilt binaries for
  # every platform we run on (musl and glibc included) and loads them at run
  # time; its install script would only compile from source with node-gyp.
  bcrypt: false
  # Denied: their postinstall only warns about the version scheme of dependents
  # (Apollo Server's usage reporting, and gRPC under Testcontainers and Terminus).
  '@apollo/protobufjs': false
  protobufjs: false
  # Denied: optional native speedups for Testcontainers' SSH transport, which the
  # local Docker socket never uses; ssh2 falls back to plain JavaScript.
  ssh2: false
  cpu-features: false
  # Vitest's mocker: the postinstall copies a browser service worker we never use.
  msw: false

# Fixes in dependencies, each with its reason. Drop a patch once its version is upgraded.
patchedDependencies:
  # The dashboard activates Lingui with Vendure's language code (pt_BR), which Intl
  # rejects as a locale, so any page with a plural, a date or a price fails in
  # Brazilian Portuguese. The patch formats with the BCP 47 tag (pt-BR) instead.
  '@vendure/dashboard@3.7.4': patches/@vendure__dashboard@3.7.4.patch
